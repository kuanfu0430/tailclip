name: Alpha release

on:
  push:
    tags:
      - "v*-alpha.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
      - name: 驗證
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          test -s shortcuts/dist/TailClip-Send.shortcut
          test -s shortcuts/dist/TailClip-Pull.shortcut
      - name: 建置與封裝
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist linux-package
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -H=windowsgui -X github.com/kuanfu0430/tailclip/internal/buildinfo.Version=${VERSION}" -o dist/TailClip.exe ./cmd/tailclip
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/kuanfu0430/tailclip/internal/buildinfo.Version=${VERSION}" -o linux-package/tailclip ./cmd/tailclip
          cp packaging/linux/install.sh packaging/linux/uninstall.sh packaging/linux/tailclip.service linux-package/
          chmod 0755 linux-package/tailclip linux-package/install.sh linux-package/uninstall.sh
          tar -C linux-package -czf dist/tailclip-linux-amd64.tar.gz .
          cp shortcuts/dist/TailClip-Send.shortcut shortcuts/dist/TailClip-Pull.shortcut dist/
          cd dist
          sha256sum TailClip.exe tailclip-linux-amd64.tar.gz TailClip-Send.shortcut TailClip-Pull.shortcut > SHA256SUMS
      - name: 建立 GitHub alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --prerelease --generate-notes --title "TailClip ${GITHUB_REF_NAME}"
