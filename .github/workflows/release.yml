name: Alpha release

on:
  push:
    tags:
      - "v*-alpha.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
      - name: 驗證
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          python3 -m unittest discover -s shortcuts/tests -v
          test -s shortcuts/dist/TailClip-Send.shortcut
          test -s shortcuts/dist/TailClip-Pull.shortcut
      - name: 建置與驗證發行包
        run: |
          python3 packaging/package.py --version "${GITHUB_REF_NAME}" --output release-output
          cp shortcuts/dist/*.shortcut release-output/
          cd release-output
          sha256sum *.zip *.tar.gz *.shortcut > SHA256SUMS
      - name: 建立 GitHub alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-output/* --prerelease --generate-notes --title "TailClip ${GITHUB_REF_NAME}"
