name: Complete TailBlink rename

on:
  push:
    branches: [chore/tailblink-rename-20260911]
    paths: [.github/workflows/tailblink-complete.yml]

permissions:
  contents: write

concurrency:
  group: tailblink-rename
  cancel-in-progress: false

jobs:
  complete:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/tailblink-rename-20260911
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare renamed sources using the reviewed transformation
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          path = pathlib.Path('.github/workflows/tailblink-rename.yml')
          workflow = path.read_text()
          start = '      - name: Rename every tracked source and path\n'
          end = '      - name: Rebuild and sign all four Apple Shortcuts\n'
          block = workflow.split(start, 1)[1].split('        run: |\n', 1)[1].split(end, 1)[0]
          subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', textwrap.dedent(block)], check=True)
          pathlib.Path('.github/workflows/tailblink-complete.yml').unlink()
          spec = pathlib.Path('docs/SPEC.md')
          text = spec.read_text().replace('新名称', '新名稱')
          text = text.replace('以 Apple CLI 簽署並解封比對語意及 manifest', '完成簽署後以 macOS Apple Archive 工具解封比對語意及 manifest')
          note = 'GitHub macOS runner 未登入 iCloud，無法直接執行 Apple Shortcuts 簽署。本次四支公開捷徑模板使用 Cherri 所採用的 RoutineHub HubSign 服務完成簽署，再以 macOS `aea`／`aa` 解封，逐一比對來源動作與 manifest。未傳送任何使用者剪貼簿、實際網址或配對憑證；此服務不是 TailBlink 執行時依賴。既有 `sign.py`／`sign_simple.py` 仍使用開發者自己的 macOS Apple CLI，不加入隱性遠端 fallback。\n\n'
          text = text.replace('## 1. 產品目標', note + '## 1. 產品目標', 1)
          spec.write_text(text, encoding='utf-8')
          windows_readme = '''TailBlink v0.2.0-alpha.3 Windows x64 完整更名測試版
          =================================================

          請完整解壓套件，保留 tailblink-cloudflared-*，再雙擊 TailBlink.exe。
          不需安裝 Go。未購買 Windows code signing，SmartScreen 可能顯示警告。

          從先前命名版本升級：
          先使用原版附帶的解除安裝程式移除桌面端，再安裝 TailBlink。
          本次更名包含設定目錄、自啟項目、Serve 路徑、配對標記與捷徑。
          原版捷徑及配對不相容；請移除原版捷徑，從新版 QR 頁安裝並重新配對。
          不自動搬移原版 token，也不偷偷刪除原版設定。勿讓兩個版本同時執行。

          已有 Tailscale：
          1. Windows 與 iPhone 安裝 Tailscale、登入同一 tailnet 並連線。
          2. 執行 TailBlink.exe，選「使用現有 Tailscale」。
          3. 程式安裝至目前使用者，開啟設定頁並常駐通知區。
          4. 依畫面建立 /tailblink 的 Serve 路徑；權限不足時才要求 UAC。
          5. iPhone 掃 QR，安裝「TailBlink：傳送」與「TailBlink：取回」。
          6. 複製配對資料，執行「取回」完成配對；先執行「傳送」則首次只配對。

          簡易連線（不需 Tailscale、VPN 或自製 iPhone App）：
          1. 桌面選「使用簡易連線」，隧道就緒後用 iPhone 相機掃 QR。
          2. 安裝「TailBlink：簡易傳送」與「TailBlink：簡易取回」。
          3. 按「連接並取回」；若未帶入資料，先複製配對資料再執行「簡易取回」。
          4. 首次允許網路與 iCloud Drive 權限。之後直接執行兩支簡易捷徑。

          QR 五分鐘有效且只能配對一次。簡易入口在重啟電腦、TailBlink、隧道或切換
          入口後須掃新 QR；捷徑不需每次重裝。新的簡易配對會使舊簡易憑證失效。
          Cloudflare HTTPS 中繼可處理傳輸內容，並非裝置間端到端加密。
          Quick Tunnel 沒有可用性保證。臨時網址無法連線時可稍後重試或換網路；
          程式不會自動修改電腦 DNS。

          日常傳輸：
          iPhone 複製文字後執行「傳送」，或從分享選單執行；之後可在電腦貼上。
          執行「取回」後可在 iPhone 貼上電腦目前的文字剪貼簿。
          電腦剪貼簿沒有文字時只通知，不清空 iPhone 原有文字。
          支援最多 1 MiB 的 UTF-8 文字，不支援圖片、HTML、檔案與背景自動同步。
          不建立剪貼簿歷史，日誌不記錄內容或 token。

          通知區與解除安裝：
          按兩下 TailBlink 圖示開啟設定頁；右鍵可切換登入後自啟或結束程式。
          再次雙擊 TailBlink.exe 或 Start-TailBlink.cmd 可重新啟動並開啟設定頁。
          雙擊 Uninstall-TailBlink.cmd 並確認後解除安裝；不移除 Tailscale，
          不更動其他 Serve 路徑。剪貼簿短暫忙碌會自動重試，持續失敗可重開程式。

          套件驗證：
          SHA256SUMS.txt 涵蓋全部附帶檔案；SOURCE.txt 是建置所用的來源 commit。
          四支 .shortcut 是已簽署的備援檔，正常情況從 QR 配對頁安裝。
          自動化與交叉編譯驗證不等於 iPhone、通知區、UAC 及登入重啟的完整實機驗收。
          '''
          pathlib.Path('packaging/windows/README-Windows.txt').write_text(textwrap.dedent(windows_readme), encoding='utf-8')
          PY
      - name: Sign public templates and verify every returned action
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, plistlib, sys, tempfile, time, urllib.error, urllib.request
          sys.path.insert(0, str(pathlib.Path('shortcuts').resolve()))
          from build import build
          from build_simple import build_simple
          from sign import semantic, unpack
          root = pathlib.Path('shortcuts/dist')
          for simple in (False, True):
              manifest = {}
              for direction in ('send', 'pull'):
                  workflow = build_simple(direction) if simple else build(direction)
                  raw = plistlib.dumps(workflow, fmt=plistlib.FMT_BINARY, sort_keys=True)
                  xml = plistlib.dumps(workflow, fmt=plistlib.FMT_XML, sort_keys=True).decode('utf-8')
                  name = 'TailBlink-' + ('Simple-' if simple else '') + direction.title() + '.shortcut'
                  payload = json.dumps({'shortcutName': name.removesuffix('.shortcut'), 'shortcut': xml}).encode('utf-8')
                  request = urllib.request.Request('https://hubsign.routinehub.services/sign', data=payload,
                      headers={'Content-Type': 'application/json', 'User-Agent': 'cherri/1.0 (TailBlink build client)',
                               'Origin': 'https://routinehub.co', 'Referer': 'https://routinehub.co/'}, method='POST')
                  for attempt in range(3):
                      try:
                          with urllib.request.urlopen(request, timeout=90) as response:
                              print('Signing response:', response.status, response.url, response.headers.get('Content-Type'), flush=True)
                              signed = response.read(4 * 1024 * 1024 + 1)
                          break
                      except urllib.error.HTTPError as exc:
                          print('Signing response error:', exc.code, exc.read(500).decode(errors='replace'), flush=True)
                          if exc.code not in (429, 502, 503, 504) or attempt == 2: raise
                          time.sleep(10 * (attempt + 1))
                  if len(signed) > 4 * 1024 * 1024 or signed[:4] != b'AEA1':
                      print('Response prefix:', signed[:500].decode(errors='replace'), flush=True)
                      raise ValueError('Signing service returned an invalid artifact: ' + name)
                  with tempfile.TemporaryDirectory(prefix='tailblink-verify-') as tmp:
                      candidate = pathlib.Path(tmp) / name
                      candidate.write_bytes(signed)
                      actual = unpack(candidate)
                      if semantic(actual) != semantic(workflow):
                          raise ValueError('Signed workflow differs from reviewed source: ' + name)
                  (root / name).write_bytes(signed)
                  manifest[name] = {'source_sha256': hashlib.sha256(raw).hexdigest(),
                      'artifact_sha256': hashlib.sha256(signed).hexdigest(), 'actions': len(workflow['WFWorkflowActions'])}
                  print('Signed and semantically verified:', name, manifest[name]['actions'], 'actions', flush=True)
              (root / ('simple-manifest.json' if simple else 'manifest.json')).write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          python3 shortcuts/sign.py --verify
          python3 shortcuts/sign_simple.py --verify
      - name: Verify renamed sources and metadata
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go test -race ./...
          python3 -m unittest discover -s shortcuts/tests -v
          python3 -m unittest discover -s packaging/tests -v
          git add -A
          python3 tools/check_branding.py
          git diff --cached --check
      - name: Commit clean source and rebuild complete packages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: rename project and all runtime identities to TailBlink'
          test -z "$(git status --porcelain)"
          python3 packaging/package.py --version v0.2.0-alpha.3 --platform all --output dist
          git add dist
          python3 tools/check_branding.py
          git diff --cached --check
          git commit -m 'build: publish verified TailBlink alpha.3 installers'
          git archive --format=zip --prefix=TailBlink/ HEAD -o "$RUNNER_TEMP/TailBlink-source.zip"
          git diff origin/main HEAD --stat
      - uses: actions/upload-artifact@v4
        with:
          name: TailBlink-verified-source-and-installers
          path: ${{ runner.temp }}/TailBlink-source.zip
          retention-days: 7
      - name: Publish tested branch only
        run: |
          git push origin HEAD:refs/heads/chore/tailblink-rename-20260911
          echo "Delivered branch commit: $(git rev-parse HEAD)"
