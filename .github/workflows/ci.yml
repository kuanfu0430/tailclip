name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
      - name: 格式檢查
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: 捷徑來源與成品一致性
        run: python -m unittest discover -s shortcuts/tests -v
      - name: 單元與整合測試
        run: go test ./...
      - name: Windows 原生剪貼簿回歸
        if: runner.os == 'Windows'
        env:
          TAILCLIP_WINDOWS_CLIPBOARD_TEST: "1"
        run: go test -count=1 ./internal/clipboard -run TestWindowsClipboardIntegration -v
      - name: Debian 無 Tailscale 安裝、更新與移除
        if: runner.os == 'Linux'
        run: >-
          docker run --rm -e TAILCLIP_INSTALL_TEST=1
          -v "${{ github.workspace }}:/work:ro" debian:13 bash -c
          'apt-get update -qq && apt-get install -y -qq python3 && bash /work/packaging/linux/test-install.sh'
      - name: Race 測試
        if: runner.os == 'Linux'
        run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
      - name: 建置、封裝與驗證 Windows／Linux
        run: python3 packaging/package.py --version ci-${{ github.sha }} --output build-output
      - uses: actions/upload-artifact@v4
        with:
          name: build-candidates
          path: build-output/
