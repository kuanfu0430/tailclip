name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
      - name: 格式檢查
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: 捷徑來源與成品一致性
        run: python -m unittest discover -s shortcuts/tests -v
      - name: 單元與整合測試
        run: go test ./...
      - name: Race 測試
        if: runner.os == 'Linux'
        run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
      - name: Windows 11 x64 build candidate
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p build-output windows-package
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o windows-package/TailClip.exe ./cmd/tailclip
          cp packaging/windows/README-Windows.txt packaging/windows/Uninstall-TailClip.cmd windows-package/
          cp shortcuts/dist/TailClip-Send.shortcut shortcuts/dist/TailClip-Pull.shortcut windows-package/
          printf 'CI build %s\n' "${GITHUB_SHA}" > windows-package/VERSION.txt
          cd windows-package
          sha256sum TailClip.exe README-Windows.txt Uninstall-TailClip.cmd VERSION.txt TailClip-Send.shortcut TailClip-Pull.shortcut > SHA256SUMS.txt
          zip -9 -r ../build-output/TailClip-Windows-x64.zip .
      - name: Linux x86_64 build candidate
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p linux-package
          go build -trimpath -ldflags="-s -w" -o linux-package/tailclip ./cmd/tailclip
          cp packaging/linux/install.sh packaging/linux/uninstall.sh packaging/linux/tailclip.service linux-package/
          chmod 0755 linux-package/tailclip linux-package/install.sh linux-package/uninstall.sh
          tar -C linux-package -czf build-output/tailclip-linux-amd64.tar.gz .
          cp shortcuts/dist/TailClip-Send.shortcut shortcuts/dist/TailClip-Pull.shortcut build-output/
          cd build-output
          sha256sum TailClip-Windows-x64.zip tailclip-linux-amd64.tar.gz TailClip-Send.shortcut TailClip-Pull.shortcut > SHA256SUMS
      - name: 驗證 build candidate 內容
        run: |
          mkdir package-check
          unzip -q build-output/TailClip-Windows-x64.zip -d package-check
          test -s package-check/TailClip.exe
          test -s package-check/README-Windows.txt
          test -s package-check/Uninstall-TailClip.cmd
          test -s package-check/VERSION.txt
          test -s package-check/TailClip-Send.shortcut
          test -s package-check/TailClip-Pull.shortcut
          (cd package-check && sha256sum -c SHA256SUMS.txt)
          (cd build-output && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: build-candidates
          path: build-output/
