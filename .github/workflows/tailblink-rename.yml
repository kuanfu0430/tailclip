name: TailBlink rename and verification

on:
  push:
    branches: [chore/tailblink-rename-20260911]
    paths: [.github/workflows/tailblink-rename.yml]

permissions:
  contents: write

concurrency:
  group: tailblink-rename
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/tailblink-rename-20260911
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Rename every tracked source and path
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import collections, pathlib, re, subprocess, textwrap
          root = pathlib.Path.cwd()
          old = bytes.fromhex('7461696c636c6970').decode()
          pattern = re.compile(old, re.I)
          variants = collections.Counter()
          counts = collections.Counter()
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          def replacement(m):
              word = m.group(0)
              variants[word] += 1
              if word.islower(): return 'tailblink'
              if word.isupper(): return 'TAILBLINK'
              if word[0].islower(): return 'tailBlink'
              return 'TailBlink'
          for name in filter(None, tracked):
              p = root / name
              counts['inspected_files'] += 1
              # Historical installers cannot be rebranded by changing their names.
              # Replace them with freshly built packages; Git history is untouched.
              if p.parent == root / 'dist' and pattern.search(p.name):
                  p.unlink()
                  counts['retired_distribution_files'] += 1
                  continue
              data = p.read_bytes()
              if p.suffix == '.shortcut':
                  counts['shortcuts_to_resign'] += 1
              else:
                  try:
                      text = data.decode('utf-8')
                  except UnicodeDecodeError:
                      if pattern.search(data.decode('latin-1')):
                          raise RuntimeError('Unexpected binary requires a rebuild: ' + name)
                  else:
                      updated, n = pattern.subn(replacement, text)
                      if n:
                          p.write_bytes(updated.encode('utf-8'))
                          counts['updated_text_files'] += 1
                          counts['text_replacements'] += n
              target = root / pattern.sub(replacement, name)
              if target != p:
                  if target.exists(): raise RuntimeError('Rename collision: ' + str(target))
                  target.parent.mkdir(parents=True, exist_ok=True)
                  p.rename(target)
                  counts['renamed_paths'] += 1
          for p in sorted(root.rglob('*'), key=lambda p: len(p.parts), reverse=True):
              if '.git' not in p.parts and p.is_dir() and not any(p.iterdir()):
                  p.rmdir()
          (root / 'shortcuts/dist').mkdir(parents=True, exist_ok=True)
          ignore = root / '.gitignore'
          ignore.write_text(ignore.read_text() + '\n!/dist/TailBlink-v*-linux-x64.tar.gz\n!/dist/TailBlink-v*-linux-x64.tar.gz.sha256\n', encoding='utf-8')
          readme = '''# TailBlink

          TailBlink 是透過 Tailscale 私有網路或臨時 HTTPS 隧道，連接 iPhone 與 Windows／Linux 的輕量剪貼簿工具。手動傳送與取回目前的純文字；不保存剪貼簿歷史，也不會在背景自動傳送每次複製內容。

          > 目前為未簽章的 alpha 測試版。Windows 可能顯示 SmartScreen 警告。自動化測試與交叉編譯不等於 iPhone／桌面實機驗收。

          ## 下載與安裝

          更名版：**v0.2.0-alpha.3**。請完整解壓套件，不要只取出主程式，附帶的 `tailblink-cloudflared-*` 是簡易連線所需的隧道程式。

          - [Windows x64 完整安裝包](dist/TailBlink-v0.2.0-alpha.3-windows-x64.zip)（[SHA-256](dist/TailBlink-v0.2.0-alpha.3-windows-x64.zip.sha256)）：解壓後雙擊 `TailBlink.exe`。不需安裝 Go 或其他 runtime。
          - [Linux x64 完整安裝包](dist/TailBlink-v0.2.0-alpha.3-linux-x64.tar.gz)（[SHA-256](dist/TailBlink-v0.2.0-alpha.3-linux-x64.tar.gz.sha256)）：在 Debian 13／Ubuntu 26.04 的 GNOME Wayland 桌面解壓後執行 `bash install.sh`；安裝器按需安裝 `wl-clipboard` 並建立使用者服務。

          套件內 `SHA256SUMS.txt` 涵蓋全部附帶檔案；`SOURCE.txt` 記錄建置所用的原始碼 commit。

          ## 從先前命名版本升級

          本次是完整更名，執行檔、設定目錄、服務、自啟項目、Serve 路徑、配對格式及四支捷徑都改用 TailBlink。不提供舊名稱相容別名，也不自動搬移舊 token。

          **先使用原版附帶的解除安裝程式移除桌面端，再安裝新版。** 這可避免原版程序占用相同連接埠或留下原版自啟與 Serve 路徑。手機端移除原版捷徑，從新版 QR 頁安裝 TailBlink 捷徑並重新配對；原版的設定檔不會由新版偷偷刪除。

          ## 兩種連線入口

          **已有 Tailscale：** 電腦與 iPhone 安裝 Tailscale、登入同一個 tailnet 並連線。桌面選「使用現有 Tailscale」，依畫面建立 `/tailblink` 的 Serve 路徑，再用 iPhone 相機掃 QR。安裝「TailBlink：傳送」與「TailBlink：取回」，複製配對資料後執行「取回」。若先執行「傳送」，首次只完成配對，需再複製要傳送的文字並執行一次。

          **簡易連線：** 不需要 Tailscale、VPN 或自製 iPhone App。桌面選「使用簡易連線」，臨時隧道就緒後掃 QR，安裝「TailBlink：簡易傳送」與「TailBlink：簡易取回」，按「連接並取回」。若按鈕無法帶入資料，先複製配對資料，再執行「簡易取回」。首次使用須允許網路與 iCloud Drive 權限。

          QR 五分鐘有效且僅能配對一次。簡易連線在電腦重開機、TailBlink／隧道重啟或切換入口後，必須重新掃 QR；同一隧道程序持續運作時可繼續使用。兩種入口同時只啟用一個；新的簡易配對成功後，舊簡易憑證立即失效。

          ## 日常使用

          **傳送：** iPhone 複製文字後執行對應的「傳送」捷徑，或從 App 分享選單執行；之後可在電腦貼上。

          **取回：** iPhone 執行對應的「取回」捷徑；之後可貼上電腦目前的文字剪貼簿。電腦沒有文字時只通知，不清空手機原有剪貼簿。

          Tailscale 入口的捷徑會呼叫 Tailscale 連線並短暫等待，不另顯示方向或裝置選單。連線失敗時確認兩端 Tailscale 與桌面 TailBlink 已啟動。桌面剪貼簿短暫忙碌會自動重試；若持續失敗，可從通知區結束 TailBlink 後重開。

          Windows 通知區圖示可開啟設定頁、切換登入後自啟或結束程式。再次雙擊 EXE 會開啟已執行的 Agent 設定頁。移除時執行套件內 `Uninstall-TailBlink.cmd`，確認後只移除本工具，不移除 Tailscale。Linux 使用隨附的 `uninstall.sh`。

          ## 範圍與隱私

          支援上限 1 MiB 的 UTF-8 純文字、多行文字、Unicode、Emoji 與文字網址；iPhone 以 iOS 26 Shortcuts／Share Sheet 為測試範圍。尚未支援圖片、HTML、檔案、Taildrop、X11、多桌面選擇、原生 iOS App、自動同步及自動更新。

          不建立剪貼簿歷史或離線佇列，日誌不記錄內容、token 或配對網址。Tailscale 入口僅監聽 localhost，再由 Serve 提供 tailnet 內 HTTPS；不啟用 Funnel。HTTPS 憑證的完整裝置名稱會出現在 Certificate Transparency 紀錄，設定頁會事先說明。

          簡易連線使用 Cloudflare 公開 HTTPS 中繼，請求必須帶配對憑證；它**不是裝置間端到端加密**，Cloudflare 可處理傳輸內容，Quick Tunnel 也沒有可用性保證。桌面簡易憑證只存在記憶體；iPhone 設定存在 iCloud Drive 的 `Shortcuts/TailBlink-Simple/config.json`。若臨時網址暫時無法連線，可稍後重試或換網路；程式不會自行修改 DNS。

          ## 開發文件

          架構、API、安全邊界、實作決策與驗收範圍見 [技術與產品規格](docs/SPEC.md)。可用 `python3 tools/check_branding.py` 檢查目前工作樹及套件中的名稱殘留；macOS 另執行 `python3 shortcuts/sign.py --verify` 與 `python3 shortcuts/sign_simple.py --verify` 驗證已簽署捷徑與來源一致。

          ## 授權與商標

          本專案尚未選定開源授權；在加入 LICENSE 前，程式碼與文件不應被視為已授予通用再利用權利。

          TailBlink 是獨立專案，與 Tailscale Inc. 無隸屬或官方合作關係。Tailscale、Taildrop 與 Apple Shortcuts 等名稱屬其各自權利人所有。
          '''
          (root / 'README.md').write_text(textwrap.dedent(readme), encoding='utf-8')
          spec = root / 'docs/SPEC.md'
          text = spec.read_text()
          text = text.replace('**文件版本：** 0.6', '**文件版本：** 0.7').replace('**日期：** 2026-09-08', '**日期：** 2026-09-11')
          text = text.replace('最後更新：2026-09-08；Windows 後續檢證與 alpha.2 修正見 14.1。', '最後更新：2026-09-11；完整更名見 0.1，Windows 後續檢證與 alpha.2 修正見 14.1。')
          text = text.replace('目前決策：Git 只追蹤版本化的完整 Windows 測試 ZIP 與其 checksum；裸 EXE、臨時 staging 目錄及其他可重建輸出仍忽略。原因是測試者必須能從 GitHub 直接下載使用，但倉庫不應混入每次 CI 都會變動的中繼檔。', '目前決策：Git 只追蹤目前版本的完整 Windows ZIP、Linux tar.gz 與其 checksum；裸執行檔、staging 及其他中繼輸出仍忽略。過往發行包保留於 Git 歷史，不保留在目前工作樹，避免測試者下載到舊品牌成品。')
          note = '''## 0.1 TailBlink 完整更名（2026-09-11）

          依使用者決定，產品名稱統一為 `TailBlink`，命令／模組／HTTP 路徑使用 `tailblink`，環境變數前綴使用 `TAILBLINK_`。掃描全部 Git 追蹤檔案與路徑，涵蓋程式碼、文件、測試、服務、安裝腳本、CI、配對標記、iCloud 設定及四支捷徑；不保留舊名稱相容別名，不改寫 Git 歷史、既有標籤或過往 Release。

          新版本為 `v0.2.0-alpha.3`。舊安裝包不能只改檔名偽裝成新版；目前工作樹改保留從更名後乾淨來源 commit 重建的 Windows／Linux 完整包，重新計算全部 checksum。四支捷徑必須由更名後 builder 重新產生、以 Apple CLI 簽署並解封比對語意及 manifest，再內嵌至執行檔。

          完整更名會改變設定目錄、Serve 路徑、服務名稱及配對標記。使用者須先用原版解除安裝程式移除原桌面端，再安裝新版、重新安裝四支捷徑中所需的兩支並配對；不自動沿用舊憑證。功能、安全邊界與原本尚未通過的實機驗收範圍不因更名而變成已通過。

          新增 `tools/check_branding.py`：不分大小寫檢查目前 Git 追蹤檔名、UTF-8／UTF-16／UTF-32 位元組內容及 ZIP／tar.gz 內部檔案；另由 macOS CI 解封驗證已簽署捷徑。檢查範圍不包含 `.git`、歷史 commit／Release、GitHub 倉庫顯示名稱或外部已安裝裝置。Go module 已使用新名称；GitHub 倉庫網址更名屬另一個平台管理操作，不在檔案更名腳本內猜測或修改。

          '''
          text = text.replace('## 1. 產品目標', textwrap.dedent(note) + '## 1. 產品目標')
          spec.write_text(text, encoding='utf-8')
          winreadme = root / 'packaging/windows/README-Windows.txt'
          winreadme.write_text(winreadme.read_text().replace('v0.2.0-alpha.2', 'v0.2.0-alpha.3'), encoding='utf-8')
          scanner = r'''#!/usr/bin/env python3
          """Reject retired branding in tracked paths, bytes and nested release packages.

          Signed shortcut semantics are verified separately by the macOS signing checks.
          Git history, repository metadata and externally installed copies are not scanned.
          """
          from __future__ import annotations
          import argparse
          import io
          import pathlib
          import re
          import subprocess
          import tarfile
          import zipfile

          ROOT = pathlib.Path(__file__).resolve().parents[1]
          # Keep the retired spelling out of the current source tree itself.
          RETIRED = bytes.fromhex('7461696c636c6970').decode('ascii')
          PATTERNS = [re.compile(re.escape(RETIRED.encode(enc)), re.I)
                      for enc in ('utf-8', 'utf-16-le', 'utf-16-be', 'utf-32-le', 'utf-32-be')]
          MAX_MEMBER = 512 * 1024 * 1024

          def check_bytes(name: str, data: bytes, failures: list[str], counts: dict[str, int], depth: int = 0) -> None:
              counts['entries'] += 1
              if any(p.search(name.encode('utf-8')) for p in PATTERNS):
                  failures.append('retired filename: ' + name)
              if any(p.search(data) for p in PATTERNS):
                  failures.append('retired content: ' + name)
              if depth > 5:
                  raise ValueError('archive nesting limit: ' + name)
              if name.lower().endswith('.zip'):
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      for entry in archive.infolist():
                          if entry.file_size > MAX_MEMBER: raise ValueError('archive member too large')
                          if not entry.is_dir():
                              check_bytes(name + '!' + entry.filename, archive.read(entry), failures, counts, depth + 1)
              elif name.lower().endswith(('.tar.gz', '.tgz', '.tar')):
                  with tarfile.open(fileobj=io.BytesIO(data), mode='r:*') as archive:
                      for entry in archive:
                          if entry.size > MAX_MEMBER: raise ValueError('archive member too large')
                          if entry.isfile():
                              stream = archive.extractfile(entry)
                              if stream is None: raise ValueError('unreadable archive member')
                              check_bytes(name + '!' + entry.name, stream.read(), failures, counts, depth + 1)

          def main() -> int:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('extra', nargs='*', type=pathlib.Path, help='additional package files or directories')
              args = parser.parse_args()
              raw = subprocess.check_output(['git', 'ls-files', '-z'], cwd=ROOT)
              paths = {ROOT / name for name in raw.decode('utf-8').split('\0') if name}
              for extra in args.extra:
                  paths.update(p for p in extra.rglob('*') if p.is_file()) if extra.is_dir() else paths.add(extra)
              failures: list[str] = []
              counts = {'entries': 0, 'files': 0}
              for path in sorted(paths):
                  if not path.is_file():
                      failures.append('tracked file missing: ' + str(path))
                      continue
                  try:
                      name = path.relative_to(ROOT).as_posix()
                  except ValueError:
                      name = path.name
                  check_bytes(name, path.read_bytes(), failures, counts)
                  counts['files'] += 1
              for failure in failures: print(failure)
              print(f"Branding audit: {counts['files']} files, {counts['entries']} entries including archive members, {len(failures)} failures")
              return 1 if failures else 0

          if __name__ == '__main__':
              raise SystemExit(main())
          '''
          (root / 'tools').mkdir(exist_ok=True)
          (root / 'tools/check_branding.py').write_text(textwrap.dedent(scanner), encoding='utf-8')
          ci = root / '.github/workflows/ci.yml'
          text = ci.read_text().replace('      - name: 格式檢查', '      - name: TailBlink 名稱與封裝殘留檢查\n        run: python tools/check_branding.py\n      - name: 格式檢查')
          text = text.replace('    needs: test', '    needs: [test, shortcut-signatures]')
          text += '\n  shortcut-signatures:\n    runs-on: macos-15\n    steps:\n      - uses: actions/checkout@v4\n      - name: Verify signed shortcuts against current source\n        run: |\n          python3 shortcuts/sign.py --verify\n          python3 shortcuts/sign_simple.py --verify\n'
          ci.write_text(text, encoding='utf-8')
          # The bootstrap workflow is deliberately absent from the delivered tree.
          (root / '.github/workflows/tailblink-rename.yml').unlink()
          print('Inventory:', dict(counts))
          print('Original case variants:', dict(variants))
          PY
      - name: Rebuild and sign all four Apple Shortcuts
        run: |
          python3 shortcuts/sign.py
          python3 shortcuts/sign_simple.py
          python3 shortcuts/sign.py --verify
          python3 shortcuts/sign_simple.py --verify
      - name: Verify renamed sources
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go test -race ./...
          python3 -m unittest discover -s shortcuts/tests -v
          python3 -m unittest discover -s packaging/tests -v
          git add -A
          python3 tools/check_branding.py
          git diff --cached --check
      - name: Commit clean source and rebuild complete packages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: rename project and all runtime identities to TailBlink'
          test -z "$(git status --porcelain)"
          python3 packaging/package.py --version v0.2.0-alpha.3 --platform all --output dist
          git add dist
          python3 tools/check_branding.py
          git diff --cached --check
          git commit -m 'build: publish verified TailBlink alpha.3 installers'
          git archive --format=zip --prefix=TailBlink/ HEAD -o "$RUNNER_TEMP/TailBlink-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TailBlink-verified-source-and-installers
          path: ${{ runner.temp }}/TailBlink-source.zip
          retention-days: 7
      - name: Publish only the tested rename branch
        run: |
          git push origin HEAD:refs/heads/chore/tailblink-rename-20260911
          echo "Delivered branch commit: $(git rev-parse HEAD)"
