name: Finalize TailBlink release documentation

on:
  push:
    branches: [chore/tailblink-rename-20260911]
    paths: [.github/workflows/tailblink-docs-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/tailblink-rename-20260911
          fetch-depth: 0
      - name: Reconcile release instructions and verify final tree
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('docs/SPEC.md')
          text = p.read_text(encoding='utf-8')
          start, end = '## 11. 發布\n', '## 12. 後續 Roadmap\n'
          assert text.count(start) == text.count(end) == 1
          section = '''## 11. 發布

          目前完整更名測試版為 **v0.2.0-alpha.3**，Windows 與 Linux 安裝包的程式及捷徑來自乾淨來源 commit `d2ec58333f7283d17e269ffeb18cfed34a7896ce`。後續純文件修正不改變套件的來源追溯記錄；套件內 `SOURCE.txt` 始終記錄實際建置來源，不以較新的文件 commit 冒充。

          目前 Git 工作樹追蹤 `dist/TailBlink-v0.2.0-alpha.3-windows-x64.zip`、`dist/TailBlink-v0.2.0-alpha.3-linux-x64.tar.gz` 及兩者 `.sha256`。舊版套件只保留在 Git 歷史及既有 Release，不留在目前檔案樹；早期 alpha.6／alpha.7 的相容性及本機建置紀錄不能套用到完整更名版本。

          Windows 套件包含 `TailBlink.exe`、已核對雜湊的 `tailblink-cloudflared-*`、第三方授權、`README-Windows.txt`、`Start-TailBlink.cmd`、`Uninstall-TailBlink.cmd`、四支 signed Shortcuts、`VERSION.txt`、`SOURCE.txt` 與涵蓋全部附帶檔案的 `SHA256SUMS.txt`。完整解壓後直接雙擊 EXE，不要求終端機或 Go toolchain；CMD 入口維持 ASCII／CRLF 及完整引號路徑。

          Linux 套件包含 `tailblink`、對應 cloudflared 及授權、四支 signed Shortcuts、安裝／解除安裝腳本、`tailblink.service`、版本／來源與 checksum 記錄。封裝檢查必須驗證可執行檔案的權限及 shell 腳本 LF 換行。

          發布前執行 Go 格式、vet、單元／整合／race 測試、捷徑來源與成品一致性、Windows 原生剪貼簿及 Debian 安裝／更新／移除回歸。macOS 負責解封四支已簽署捷徑，比對全部動作／參數；跨平台建置及驗證不代表完成 iPhone 或桌面 GUI 實機驗收。

          `python3 tools/check_branding.py` 對目前追蹤檔名、文字與二進位內容、ZIP／tar.gz 內部項目進行不分大小寫的舊名稱檢查。CI 不保存或產生真實配對 token。新增正式 GitHub Release 與倉庫網址更名是平台操作，不因檔案修改而自動完成。

          本版沒有自動更新。從先前命名版本升級，必須先用原版解除安裝程式移除桌面端，安裝 TailBlink 後重新安裝所需的兩支手機捷徑並配對；不提供舊名稱別名或憑證自動遷移。不要讓兩個命名版本同時執行。正常使用新版時，同一組捷徑不需因簡易隧道重啟而重裝，但必須掃新 QR。

          '''
          import textwrap
          text = text.split(start, 1)[0] + textwrap.dedent(section) + end + text.split(end, 1)[1]
          old_link = '[#5 待做功能](https://github.com/kuanfu0430/tailblink/issues/5)'
          assert old_link in text
          text = text.replace(old_link, 'issue #5（待做功能）')
          p.write_text(text, encoding='utf-8')
          p = pathlib.Path('shortcuts/README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('alpha.2 修正備援剪貼簿票券', '**v0.2.0-alpha.3 完整更名升級：** 先前命名版本的捷徑、設定路徑及配對格式不相容；請移除原版捷徑，從新版 QR 頁重新安裝對應兩支 TailBlink 捷徑並配對。只改捷徑顯示名稱不能完成遷移。\n\n歷史修正：alpha.2 修正備援剪貼簿票券', 1)
          old = '簽署需要 Apple 簽署服務可用。sign.py 先解封候選檔核對所有 actions／參數，通過才更新 `dist/*.shortcut` 及 `manifest.json`。CI 在其他平台只做來源與成品 hash 及結構檢查，不會假裝重新簽署或執行捷徑。'
          new = '使用 Apple CLI 簽署需要 macOS 已登入 iCloud，且 Apple 簽署服務可用。`sign.py`／`sign_simple.py` 先解封候選檔核對所有 actions／參數，通過才更新 `dist/*.shortcut` 及對應 manifest。Windows／Linux CI 檢查來源與成品 hash 及結構；macOS CI 另解封已簽署成品並比對來源語意。CI 不重新簽署，也不執行需要使用者授權的捷徑動作。本次成品的簽署來源見 SPEC 0.1；一般重建腳本不會隱性上傳到遠端服務。'
          assert old in text
          p.write_text(text.replace(old, new), encoding='utf-8')
          pathlib.Path('.github/workflows/tailblink-docs-finalize.yml').unlink()
          PY
          git add -A
          python3 tools/check_branding.py
          python3 -m unittest discover -s shortcuts/tests -v
          python3 -m unittest discover -s packaging/tests -v
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: reconcile TailBlink alpha.3 release and upgrade instructions'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          git archive --format=zip --prefix=TailBlink/ HEAD -o "$RUNNER_TEMP/TailBlink-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TailBlink-final-source-and-installers
          path: ${{ runner.temp }}/TailBlink-source.zip
          retention-days: 7
      - name: Publish verified documentation
        run: git push origin HEAD:refs/heads/chore/tailblink-rename-20260911
